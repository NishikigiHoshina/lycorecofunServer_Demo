spring.application.name=lycorisfunServer
server.port=12808
server.servlet.context-path=/lycorisfunServer

spring.datasource.type=com.alibaba.druid.pool.DruidDataSource
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/useforcommon?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=XXX

mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.lycorisfun.fun.Entity
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# ===== 文件上传（配置化；路径/规则不硬编码在代码）=====
# 根目录默认跨平台（用户主目录）；部署/本机可在本行覆盖
lycorisfun.upload.root=${user.home}/lycorisfun-upload
# index-img：后台首页宣传图；urlPath 沿用 /upload（urlPath+dir 决定静态映射与对外 URL）
lycorisfun.upload.types[0].key=index-img
lycorisfun.upload.types[0].urlPath=/upload
lycorisfun.upload.types[0].dir=img
lycorisfun.upload.types[0].extensions=jpg,jpeg,png,gif,webp
lycorisfun.upload.types[0].max-size=5MB
# post-img：帖子正文内嵌配图。任何登录用户可上传（作者要能插图），故用 storeImage() 解码后重编码
# 注意 urlPath 必须与 types[0] 不同：两者若同为 /upload，WebConfig 的静态映射会互相覆盖，导致其中一个目录 404。
# 这里用 /upload/post（更具体的模式由 Spring 优先匹配），正文里存的 src 是**相对路径**，渲染时由前端补 origin。
lycorisfun.upload.types[1].key=post-img
lycorisfun.upload.types[1].urlPath=/upload/post
lycorisfun.upload.types[1].dir=post
lycorisfun.upload.types[1].extensions=jpg,jpeg,png,gif,webp
lycorisfun.upload.types[1].max-size=5MB
# 未来新增资源类型：追加 types[n]（key/urlPath/dir/extensions/max-size）即可，静态映射与校验自动跟随

# 全局上传上限给足余量，单类型大小由 lycorisfun.upload.types[*].max-size 精控
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
